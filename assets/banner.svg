<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="border-radius: 12px; background: #0b0f19;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a101f"/>
    </linearGradient>

    <!-- Metallic & Neon Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" opacity="0.25"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(0.5deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-0.5deg); }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .glow-node {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .float-card-1 {
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .float-card-2 {
        animation: floatSlow2 7s ease-in-out infinite;
      }
      .data-stream {
        stroke-dasharray: 8 16;
        animation: flowData 2.5s linear infinite;
      }
      .radar-arm {
        transform-origin: 1040px 180px;
        animation: radarSweep 8s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .body-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGlow)"/>
  <rect width="1200" height="360" rx="12" fill="url(#grid)"/>

  <!-- Dynamic Animated Atmosphere in Background -->
  <g opacity="0.7">
    <!-- Top-Left Ambient Orb -->
    <circle cx="180" cy="60" r="160" fill="#0284c7" opacity="0.12" filter="url(#neonGlow)" class="glow-node"/>
    <!-- Bottom-Right Ambient Orb -->
    <circle cx="1040" cy="240" r="180" fill="#6366f1" opacity="0.15" filter="url(#neonGlow)" class="glow-node"/>
  </g>

  <!-- Dynamic Telemetry Waveform and Data Circuit (Background Layer) -->
  <g opacity="0.35">
    <path d="M 0 310 Q 150 280 300 310 T 600 300 T 900 320 T 1200 300" fill="none" stroke="#0284c7" stroke-width="1.5" class="data-stream"/>
    <path d="M 0 325 Q 200 350 400 325 T 800 335 T 1200 320" fill="none" stroke="#38bdf8" stroke-width="1.2" class="data-stream" style="animation-duration: 3.8s;"/>
    <!-- Connective Network lines -->
    <line x1="880" y1="110" x2="1040" y2="180" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="1040" y1="180" x2="980" y2="280" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 6"/>
  </g>

  <!-- Right-Hand Dynamic Graphic: Interactive Fleet Radar & Orbit Rings -->
  <g transform="translate(10, 0)">
    <!-- Concentric Target Rings -->
    <circle cx="1040" cy="180" r="105" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="1040" cy="180" r="75" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="1040" cy="180" r="45" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.6"/>
    <circle cx="1040" cy="180" r="5" fill="#38bdf8"/>

    <!-- Rotating Radar Beam -->
    <g class="radar-arm">
      <line x1="1040" y1="180" x2="1145" y2="180" stroke="url(#cyberCyan)" stroke-width="2" opacity="0.8"/>
      <polygon points="1040,180 1145,155 1145,180" fill="url(#cyberCyan)" opacity="0.12"/>
    </g>

    <!-- Floating Fleet Nodes with dynamic pulse -->
    <g class="float-card-1">
      <circle cx="980" cy="130" r="7" fill="#10b981" filter="url(#neonGlow)"/>
      <circle cx="980" cy="130" r="14" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4"/>
      <text x="996" y="134" fill="#a7f3d0" font-size="11" class="body-text" font-weight="600">AMR Fleet Alpha</text>
    </g>

    <g class="float-card-2">
      <circle cx="1090" cy="235" r="6" fill="#38bdf8" filter="url(#neonGlow)"/>
      <circle cx="1090" cy="235" r="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
      <text x="1106" y="239" fill="#bae6fd" font-size="11" class="body-text" font-weight="600">RobOps Node #04</text>
    </g>

    <g>
      <circle cx="1010" cy="245" r="5" fill="#f59e0b" filter="url(#neonGlow)"/>
      <text x="942" y="265" fill="#fde68a" font-size="10" class="body-text">Arm Cell Active</text>
    </g>
  </g>

  <!-- Floating Dynamic Feature Badges (Bottom Center/Right) -->
  <g class="float-card-1" filter="url(#cardShadow)">
    <rect x="580" y="280" width="165" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="598" cy="297" r="4.5" fill="#38bdf8"/>
    <text x="612" y="302" fill="#f8fafc" font-size="12" class="body-text" font-weight="600">Hardware Agnostic</text>
  </g>

  <g class="float-card-2" filter="url(#cardShadow)">
    <rect x="760" y="280" width="160" height="34" rx="17" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="778" cy="297" r="4.5" fill="#818cf8"/>
    <text x="792" y="302" fill="#f8fafc" font-size="12" class="body-text" font-weight="600">ROS 2 &amp; Open-RMF</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Badges (Crisp, High-Contrast & Unobstructed) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Super-Header -->
    <g transform="translate(0, 52)">
      <rect width="270" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1"/>
      <circle cx="15" cy="14" r="4" fill="#38bdf8"/>
      <text x="28" y="18" fill="#7dd3fc" font-size="11.5" class="body-text" font-weight="700" letter-spacing="1">CURATED ROBOTICS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#titleGrad)" font-size="37" class="title-text">
      Awesome General-Purpose
    </text>
    <text x="0" y="176" fill="url(#titleGrad)" font-size="37" class="title-text">
      Robotics Software Layers
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="218" fill="#94a3b8" font-size="15.5" class="body-text" font-weight="400">
      Enterprise SaaS Platforms, Fleet Orchestration, RobOps &amp; Open-Source Middleware
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 252)">
      <!-- Item 1 -->
      <g>
        <rect x="0" y="0" width="128" height="26" rx="6" fill="#1e293b" fill-opacity="0.8"/>
        <text x="10" y="17" fill="#38bdf8" font-size="12" class="body-text" font-weight="600">⚡ RobOps SaaS</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(138, 0)">
        <rect x="0" y="0" width="148" height="26" rx="6" fill="#1e293b" fill-opacity="0.8"/>
        <text x="10" y="17" fill="#38bdf8" font-size="12" class="body-text" font-weight="600">🤖 Fleet Orchestration</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(296, 0)">
        <rect x="0" y="0" width="144" height="26" rx="6" fill="#1e293b" fill-opacity="0.8"/>
        <text x="10" y="17" fill="#38bdf8" font-size="12" class="body-text" font-weight="600">🌐 Open Middleware</text>
      </g>
    </g>
  </g>
</svg>
